<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TreeCat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="navigetion-bar">
            <div class="logo">
                <i class="fa-solid fa-tree"></i>
                Treecat
            </div>
            <div class="nav-1"><a href="" target="_blank">Choose you cats favorites</a></div>
            <div class="search">
                <input class="search-box" type="text" placeholder="search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>
    </header>
<main>
    <div class="main">
        <!-- Product Section -->
        <section class="products">
            <div class="product-food1">
                <div class="product-img"><img src="../meat.png" alt="meat"></div>
                <div class="product-name">Meat</div>
                <div class="product-price">$10</div>
                <button class="add-cart">Add to Cart</button>
            </div>
            <div class="product-food2">
                <div class="product-img"><img src="../catfood1.png" alt="catfood"></div>
                <div class="product-name">Cat food</div>
                <div class="product-price">$12</div>
                <button class="add-cart">Add to Cart</button>
            </div>
            <div class="product-food3">
                <div class="product-img"><img src="../northpaw.png" alt="catfood"></div>
                <div class="product-name">North Paw</div>
                <div class="product-price">$15</div>
                <button class="add-cart">Add to Cart</button>
            </div>
       
           <!---------toy------->
        
            <div class="product-toy">
                <div class="product-img"><img src="../cattoy.png" alt="Toy"></div>
                <div class="product-name">Bolls</div>
                <div class="product-price">$10</div>
                <button class="add-cart">Add to Cart</button>
            </div>
            <div class="product-food">
                <div class="product-img"><img src="../cattoy1.png" alt="Toy"></div>
                <div class="product-name">Ret</div>
                <div class="product-price">$12</div>
                <button class="add-cart">Add to Cart</button>
            </div>
            <div class="product-food">
                <div class="product-img"><img src="../cattoy2.png" alt="Toy"></div>
                <div class="product-name">Cat Toy</div>
                <div class="product-price">$15</div>
                <button class="add-cart">Add to Cart</button>
            </div>
        </section>

        

        <!-- Cart Button -->
        <button class="cart-btn">🛒 Cart</button>

        <!-- Cart Section (hidden by default) -->
        <aside class="cart hidden">
            <div class="cart-header">
                <h3>Your Cart</h3>
                <button class="close-cart">X</button>
            </div>

            <div class="cart-item">
                <div class="item-name">Item 1</div>
                <div class="item-price">$10</div>
                <button class="cancel">Remove</button>
            </div>
            <div class="cart-item">
                <div class="item-name">Item 2</div>
                <div class="item-price">$12</div>
                <button class="cancel">Remove</button>
            </div>

            <div class="cart-actions">
                <button class="find">Checkout</button>
                <button class="clear-cart">Clear Cart</button>
            </div>
        </aside>
    </div>
</main>

    <footer>
       <div class="footer-bar">
         <div class="footer-about">
            <i class="fa-solid fa-user"></i>
            <a href="" target="_blank">About Us</a>
            
         </div>

         <div class="footer-contact">
            <i class="fa-solid fa-envelope"></i>
            <a href="" target="_blank">Contact</a>
            
         </div>
       </div>
   </footer>


</body>
</html>
