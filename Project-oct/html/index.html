<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <header>
        <div class="nevigation">
            <div class="nev-logo">
                <div class="logo ">
                    <img src="./Amazon-Logo.png" width="140px" />
                </div>
                <div class="nav-address">
                    <p class="address1">deliver to</p>
                    <div class="add-icon">
                        <i class="fa-solid fa-location-dot"></i>
                        <p class="address2">Bangladesh</p>
                    </div>
                    
                </div>
            </div>
            <div class="nav-search">
                        <select name="select" id="search-select">
                            <option value="">
                                All
                            </option>
                        </select>
                        <input placeholder="search Amazon" type="text" class="search-input">
                        <div class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
            </div>
            <div class="nav-flag">
                <div class="flag-icon"><i class="fa-solid fa-flag"></i></div>
                <select class="flag-select">
                    <option value="">EN</option>
                </select>
            </div>

            <div class="nav-signin">
                <p>
                    <span>Hello, sign In </span>
                </p>
                <p class="nav-second">
                    Account & Lists
                </p>
            </div>

            <div class="nav-return">
                <p>
                    <span>Returns</span>
                </p>
                <p class="nav-second">
                    & oders
                </p>
            </div>

            <div class="nav-cart">
                <i class="fa-solid fa-cart-plus"></i>
                Cart
            </div>
        </div>

        <div class="panel">
            <div class="panel-all">
                <i class="fa-solid fa-bars"></i>
                All
            </div>

            <div class="panel-option">
                <p>Today's Deals</p>
                <p>Customer Service</p>
                <p>Registry</p>
                <p>Gifts cards</p>
                <p>Sell</p>
            </div>

            <div class="panel-deals">
                Shop deals in electronics
            </div>

        </div>
    </header>
</body>
</html>
